name: Build Docker Images

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
     
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Docker Login
      uses: docker/login-action@v4.8.0
      with:        
        registry: ghcr.io
        username: horvathmar
        password: ${{ secrets.GHCR_TOKEN }}
        
    - name: Build and push the Docker images
      run: |  
        VERSION=$(date +%s)
        docker build ./backend --tag ghcr.io/horvathmar/kviz-backend:$VERSION
        docker build ./frontend --tag ghcr.io/horvathmar/kviz-frontend:$VERSION
        docker push ghcr.io/horvathmar/kviz-backend:$VERSION
        docker push ghcr.io/horvathmar/kviz-frontend:$VERSION
    
